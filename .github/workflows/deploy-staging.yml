name: Deploy to Staging

on:
  push:
    branches: ["release/**"]

env:
  SERVICE_NAME: sentient-archive-web-staging
  CUSTOM_DOMAIN: staging.sentientarchive.moliveda.dev
  REGION: us-central1
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: sentient-archive-web

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ steps.domain-mapping.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_URL: https://${{ env.CUSTOM_DOMAIN }}
          VITE_USE_EMULATOR: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (Protected with Auth)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: protected
          build-args: |
            AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
            AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_APP_URL=https://${{ env.CUSTOM_DOMAIN }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}" \
            --platform=managed \
            --region="${{ env.REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=8 \
            --port=80 \
            --timeout=60

      - name: Map custom domain to Cloud Run service
        id: domain-mapping
        run: |
          echo "Creating domain mapping for ${{ env.CUSTOM_DOMAIN }}..."

          # Check if domain mapping already exists
          if gcloud beta run domain-mappings describe \
            --domain="${{ env.CUSTOM_DOMAIN }}" \
            --region="${{ env.REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(metadata.name)' 2>/dev/null; then
            echo "Domain mapping already exists for ${{ env.CUSTOM_DOMAIN }}"
          else
            echo "Creating new domain mapping..."
            gcloud beta run domain-mappings create \
              --service="${{ env.SERVICE_NAME }}" \
              --domain="${{ env.CUSTOM_DOMAIN }}" \
              --region="${{ env.REGION }}" \
              --project="${{ secrets.GCP_PROJECT_ID }}"
          fi

          echo "url=https://${{ env.CUSTOM_DOMAIN }}" >> "$GITHUB_OUTPUT"

      - name: Deployment Summary
        run: |
          {
            echo "### 🚀 Staging Deployment Successful!"
            echo ""
            echo "**Custom Domain:** https://${{ env.CUSTOM_DOMAIN }}"
            echo "**Image:** docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}"
            echo "**Project:** ${{ secrets.GCP_PROJECT_ID }}"
            echo "**Region:** ${{ env.REGION }}"
            echo "**Access:** Protected (HTTP Basic Auth)"
            echo ""
            echo "✅ **Custom domain mapped successfully** - Password reset emails will work immediately!"
            echo ""
            echo "> 💡 Make sure DNS records are configured on Namecheap for ${{ env.CUSTOM_DOMAIN }}"
          } >> "$GITHUB_STEP_SUMMARY"
