# E2E Staging

# Manual / post-deploy E2E against staging (HTTP Basic Auth + test accounts).
# Does not block PR CI. Trigger via workflow_dispatch.

name: E2E Staging

on:
  workflow_dispatch:

jobs:
  e2e-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke E2E
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_BASIC_AUTH_USER: ${{ secrets.AUTH_USERNAME }}
          E2E_BASIC_AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e:staging

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-staging-report
          path: playwright-report/
          retention-days: 7
