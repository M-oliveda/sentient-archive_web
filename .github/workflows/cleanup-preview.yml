# Cleanup Preview Workflow
#
# Cleans up ephemeral preview environments when PRs are closed
# Deletes the Cloud Run service and comments on the PR

name: Cleanup Preview Environment

on:
  pull_request:
    types: [closed]
    branches: [develop, main]

env:
  REGION: us-central1

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      pull-requests: write
      contents: read
      id-token: write

    steps:
      - name: Generate preview service name
        id: preview-name
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SERVICE_NAME="sentient-archive-pr-${PR_NUMBER}"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run service
        continue-on-error: true
        run: |
          gcloud run services delete ${{ steps.preview-name.outputs.service_name }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet || echo "Service not found or already deleted"

      - name: Comment PR with cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';

            const comment = `## 🧹 Preview Environment Cleaned Up

            **Service:** \`${serviceName}\`
            **Status:** Deleted

            The ephemeral preview environment has been removed.
            `;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
