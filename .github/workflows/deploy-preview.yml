# Deploy Preview Workflow
#
# Deploys ephemeral preview environments for Pull Requests
# Each PR gets its own Cloud Run service with HTTP Basic Auth

name: Deploy to Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

env:
  REGION: us-central1
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: sentient-archive-web

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.domain-mapping.outputs.url }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate preview service name and domain
        id: preview-name
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SERVICE_NAME="sentient-archive-pr-${PR_NUMBER}"
          CUSTOM_DOMAIN="preview-pr-${PR_NUMBER}.sentientarchive.moliveda.dev"
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "custom_domain=${CUSTOM_DOMAIN}" >> $GITHUB_OUTPUT
          echo "Preview service: ${SERVICE_NAME}"
          echo "Custom domain: ${CUSTOM_DOMAIN}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --target protected \
            --build-arg AUTH_USERNAME=${{ secrets.AUTH_USERNAME }} \
            --build-arg AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }} \
            --build-arg VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }} \
            --build-arg VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }} \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_APP_URL=https://${{ steps.preview-name.outputs.custom_domain }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
            .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gcloud beta components
        run: |
          gcloud components install beta --quiet

      - name: Deploy to Cloud Run (Preview)
        run: |
          gcloud run deploy ${{ steps.preview-name.outputs.service_name }} \
            --image=docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --port=80 \
            --timeout=60 \
            --concurrency=80 \
            --cpu-throttling \
            --tag=pr-${{ github.event.pull_request.number }}

      - name: Map custom domain to preview service
        id: domain-mapping
        run: |
          CUSTOM_DOMAIN="${{ steps.preview-name.outputs.custom_domain }}"
          echo "Creating domain mapping for ${CUSTOM_DOMAIN}..."

          # Check if domain mapping already exists
          if gcloud beta run domain-mappings describe \
            --domain="${CUSTOM_DOMAIN}" \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(metadata.name)' \
            --quiet 2>/dev/null; then
            echo "Domain mapping already exists for ${CUSTOM_DOMAIN}"
          else
            echo "Creating new domain mapping..."
            gcloud beta run domain-mappings create \
              --service=${{ steps.preview-name.outputs.service_name }} \
              --domain="${CUSTOM_DOMAIN}" \
              --region=${{ env.REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --quiet
          fi

          echo "url=https://${CUSTOM_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = '${{ steps.domain-mapping.outputs.url }}';
            const serviceName = '${{ steps.preview-name.outputs.service_name }}';
            const customDomain = '${{ steps.preview-name.outputs.custom_domain }}';

            const comment = `## 🚀 Preview Deployment Ready!

            ### 🔗 [**View Preview Deployment →**](${previewUrl})

            | Property | Value |
            | --- | --- |
            | **Environment** | Preview (Ephemeral) |
            | **Service** | \`${serviceName}\` |
            | **Custom Domain** | \`${customDomain}\` |
            | **URL** | ${previewUrl} |
            | **Commit** | \`${context.sha.substring(0, 7)}\` |

            ---

            **📋 Environment Details:**
            - **Purpose:** Test individual PRs in isolated environments
            - **Data Type:** Synthetic / Fake data
            - **Security Level:** Medium (HTTP Basic Auth)
            - **Who Uses It:** Devs, QA, Product

            > 💡 **Note:** This preview environment will be automatically cleaned up when the PR is closed or merged. Credentials are available in the GitHub Environment secrets.
            > 
            > ⚠️ **DNS Setup Required:** Make sure the wildcard DNS record \`*.sentientarchive.moliveda.dev\` is configured on Namecheap for the custom domain to work.
            `;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
